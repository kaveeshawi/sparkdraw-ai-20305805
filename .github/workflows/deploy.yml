name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GH_TOKEN
          # Do NOT use script_stop — it breaks if/else (false tests become exit 1)
          script: |
            set -e
            APP_DIR=/var/www/sparkdraw-ai
            REPO_SLUG=kaveeshawi/sparkdraw-ai-20305805.git
            AUTH_REPO="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}"

            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN is empty — cannot clone private repo"
              exit 1
            fi

            sudo mkdir -p /var/www
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo git clone "$AUTH_REPO" "$APP_DIR"
            fi

            # Avoid "dubious ownership" when repo is owned by www-data/root
            sudo git config --system --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$APP_DIR" || true
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"
            git remote set-url origin "$AUTH_REPO"
            git fetch origin main
            git reset --hard origin/main
            # Do not leave the token in the remote URL on disk
            git remote set-url origin "https://github.com/${REPO_SLUG}"
            echo "Code at $(git rev-parse --short HEAD)"

            # upsell_model_v2.pkl needs scikit-learn 1.8 → Python 3.11+
            ensure_python311() {
              if command -v python3.11 >/dev/null 2>&1; then
                return 0
              fi
              echo "Installing Python 3.11..."
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3.11 python3.11-venv python3.11-dev
            }
            ensure_python311
            PY_BIN="$(command -v python3.11)"

            # Recreate venv if missing or wrong Python major.minor
            NEED_VENV=0
            if [ ! -d venv ]; then
              NEED_VENV=1
            else
              VENV_PY="$(./venv/bin/python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null || echo 0)"
              if [ "$VENV_PY" != "3.11" ] && [ "$VENV_PY" != "3.12" ]; then
                echo "Recreating venv (was Python $VENV_PY, need 3.11+ for sklearn 1.8)"
                NEED_VENV=1
              fi
            fi
            if [ "$NEED_VENV" = "1" ]; then
              rm -rf venv
              "$PY_BIN" -m venv venv
            fi

            ./venv/bin/python -c "import sys; print('python', sys.version)"
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            if [ ! -f models/upsell_model_v2.pkl ]; then
              echo "WARNING: models/upsell_model_v2.pkl missing — upsell will 503"
            else
              ls -lh models/upsell_model_v2.pkl models/feature_names.pkl
            fi

            if [ ! -f /etc/systemd/system/sparkdraw-ai.service ]; then
              sudo cp deploy/sparkdraw-ai.service /etc/systemd/system/sparkdraw-ai.service
              sudo systemctl daemon-reload
              sudo systemctl enable sparkdraw-ai
            else
              sudo cp deploy/sparkdraw-ai.service /etc/systemd/system/sparkdraw-ai.service
              sudo systemctl daemon-reload
            fi

            sudo chown -R www-data:www-data "$APP_DIR"
            sudo systemctl restart sparkdraw-ai
            sudo systemctl --no-pager --full status sparkdraw-ai
            echo "Deploy finished OK"
